name: Generate offline version

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 7 1 * *'

permissions:
  contents: read

jobs:
  documents:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install publishing dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Install Pandoc 3.13
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/pandoc.deb" \
            https://github.com/jgm/pandoc/releases/download/3.13/pandoc-3.13-1-amd64.deb
          sudo dpkg -i "$RUNNER_TEMP/pandoc.deb"

      - name: Validate document structure and publishing helpers
        run: npm test

      - name: Build and inspect PDF, HTML, DOCX, and screenshots
        run: npm run build

      - name: Check documentation links and anchors
        run: npm run check:links

      - name: Upload documents, previews, and validation reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: Generated documents
          retention-days: 60
          if-no-files-found: error
          path: |
            output/ACA-vs-AKS-comparison-guide.pdf
            output/ACA-vs-AKS-comparison-guide.docx
            output/ACA-vs-AKS-comparison-guide.html
            output/link-report.json
            output/pdf-report.json
            media/guide-preview.png
            media/comparison-preview.png
